[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vuebench"
version = "0.1.0"
description = "A small deterministic benchmark for coding agents on Vue.js tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-evals>=0.1.0",
  "pyyaml>=6.0",
]

[project.scripts]
vuebench = "vuebench.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vuebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vuebench"]
